// ---------------------------------------------------------------------------
// Ministry of Tourism - Rental Accommodation System
// Service contract for DSA612S Assignment 1, Question 2.
//
// Four RPC styles are covered:
//   simple (unary)      add_property, update_property, remove_property,
//                       search_property, book_property, confirm_booking
//   client streaming    create_users
//   server streaming    list_available_properties
//
// Dates are exchanged as ISO-8601 calendar dates ("YYYY-MM-DD") and money as
// double, so the wire format stays readable in grpcurl and in the logs.
// ---------------------------------------------------------------------------

syntax = "proto3";

package rental;

service RentalService {

    // A Host registers a new listing; the server allocates the property_id.
    rpc add_property (AddPropertyRequest) returns (AddPropertyResponse);

    // Client-side streaming: many user profiles are streamed to the server,
    // which replies once, after the stream is complete.
    rpc create_users (stream User) returns (CreateUsersResponse);

    // A Host edits an existing listing, keyed on property_id.
    rpc update_property (UpdatePropertyRequest) returns (UpdatePropertyResponse);

    // A Host removes a listing; the server replies with the remaining
    // properties in that Host's region.
    rpc remove_property (RemovePropertyRequest) returns (RemovePropertyResponse);

    // Server-side streaming: matching properties are streamed back one by one.
    rpc list_available_properties (ListPropertiesRequest) returns (stream Property);

    // A Guest looks up one property by id.
    rpc search_property (SearchPropertyRequest) returns (SearchPropertyResponse);

    // A Guest puts a dated stay into the temporary booking cart.
    rpc book_property (BookPropertyRequest) returns (BookPropertyResponse);

    // The cart is validated, priced and turned into confirmed bookings.
    rpc confirm_booking (ConfirmBookingRequest) returns (ConfirmBookingResponse);
}

// ------------------------------- entities ----------------------------------

// role: "HOST" or "GUEST".
message User {
    string user_id = 1;
    string name = 2;
    string email = 3;
    string role = 4;
    string phone = 5;
}

// status: "AVAILABLE" or "UNAVAILABLE".
// property_type: "APARTMENT", "GUESTHOUSE", "LODGE", "CAMPSITE", "HOUSE".
message Property {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    string region = 5;
    string property_type = 6;
    double price_per_night = 7;
    string status = 8;
    int32 max_guests = 9;
    string description = 10;
}

message Booking {
    string booking_id = 1;
    string property_id = 2;
    string property_name = 3;
    string guest_id = 4;
    string check_in = 5;
    string check_out = 6;
    int32 nights = 7;
    double price_per_night = 8;
    double total_cost = 9;
    string status = 10;
}

// ------------------------------- add_property -------------------------------

message AddPropertyRequest {
    string host_id = 1;
    string name = 2;
    string location = 3;
    string region = 4;
    string property_type = 5;
    double price_per_night = 6;
    string status = 7;
    int32 max_guests = 8;
    string description = 9;
}

message AddPropertyResponse {
    bool success = 1;
    string property_id = 2;
    string message = 3;
}

// ------------------------------- create_users -------------------------------

message CreateUsersResponse {
    bool success = 1;
    int32 created_count = 2;
    int32 rejected_count = 3;
    repeated string created_user_ids = 4;
    repeated string errors = 5;
    string message = 6;
}

// ----------------------------- update_property ------------------------------

// Empty strings and zero values mean "leave this field unchanged", which keeps
// the message usable as a partial update without proto3 field presence.
message UpdatePropertyRequest {
    string property_id = 1;
    string host_id = 2;
    string name = 3;
    string location = 4;
    string region = 5;
    string property_type = 6;
    double price_per_night = 7;
    string status = 8;
    int32 max_guests = 9;
    string description = 10;
}

message UpdatePropertyResponse {
    bool success = 1;
    string message = 2;
    Property property = 3;
}

// ----------------------------- remove_property ------------------------------

message RemovePropertyRequest {
    string property_id = 1;
    string host_id = 2;
}

message RemovePropertyResponse {
    bool success = 1;
    string message = 2;
    repeated Property remaining_properties = 3;
}

// ------------------------ list_available_properties -------------------------

// Every filter is optional: an empty string or a zero disables that filter.
message ListPropertiesRequest {
    string location = 1;
    string region = 2;
    double min_price = 3;
    double max_price = 4;
    int32 guests = 5;
    string check_in = 6;
    string check_out = 7;
}

// ------------------------------ search_property -----------------------------

message SearchPropertyRequest {
    string property_id = 1;
}

message SearchPropertyResponse {
    bool available = 1;
    string message = 2;
    Property property = 3;
}

// ------------------------------- book_property ------------------------------

message BookPropertyRequest {
    string guest_id = 1;
    string property_id = 2;
    string check_in = 3;
    string check_out = 4;
    int32 guests = 5;
}

message BookPropertyResponse {
    bool accepted = 1;
    string message = 2;
    string cart_item_id = 3;
    int32 nights = 4;
    double estimated_total = 5;
}

// ----------------------------- confirm_booking ------------------------------

// An empty cart_item_id confirms every item currently in the Guest's cart.
message ConfirmBookingRequest {
    string guest_id = 1;
    string cart_item_id = 2;
}

message ConfirmBookingResponse {
    bool confirmed = 1;
    string message = 2;
    repeated Booking bookings = 3;
    double grand_total = 4;
    repeated string rejected = 5;
}
